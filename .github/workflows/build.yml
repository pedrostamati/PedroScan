name: Compilar APK de PedroScan

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar archivos del proyecto
        run: |
          if [ ! -f "settings.gradle" ]; then
            ZIPFILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIPFILE" ]; then
              unzip -q -o "$ZIPFILE" -d .
            fi
            SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -r "$SUBDIR"/* .
            fi
          fi
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ar.com.estudiodetitulos.pedroscan'
              compileSdk 34

              defaultConfig {
                  applicationId "ar.com.estudiodetitulos.pedroscan"
                  minSdk 24
                  targetSdk 34
                  versionCode 98
                  versionName "9.8"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Compilar APK (PedroScan.apk)
        run: gradle assembleRelease --no-daemon

      - name: Preparar PedroScan.apk
        run: cp app/build/outputs/apk/release/*.apk ./PedroScan.apk

      - name: Subir PedroScan.apk listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: PedroScan-APK
          path: ./PedroScan.apk
